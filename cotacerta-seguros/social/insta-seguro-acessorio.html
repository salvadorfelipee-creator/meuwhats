<style>

  html,body{width:1080px;height:1080px;overflow:hidden;font-family:'Segoe UI',Inter,Arial,sans-serif;}
  .post{position:relative;width:1080px;height:1080px;background:#EAF1FF;overflow:hidden;}

  .site{font-family:'Poppins','Segoe UI',sans-serif;font-weight:800;color:#0052CC;font-size:17px;}
  .dome{position:absolute;left:64px;right:64px;top:108px;height:530px;border-radius:0 0 42% 42%;

  .cta-bottom .ic{width:26px;height:26px;border-radius:50%;background:#25D366;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .cta-bottom .ic svg{width:14px;height:14px;fill:#fff;}
  .cta-bottom span{font-weight:800;color:#fff;font-size:17px;}
  .stat-wrap{position:absolute;right:120px;top:335px;color:#fff;text-align:right;}
  .stat-wrap .lbl{font-size:15px;font-weight:600;opacity:.92;}
  .stat-wrap .num{font-family:'Poppins','Segoe UI',sans-serif;font-size:44px;font-weight:800;line-height:1.05;margin-top:2px;}
  .photo-card{position:absolute;left:165px;top:560px;width:750px;height:390px;border-radius:22px;overflow:hidden;
    border:8px solid #fff;box-shadow:0 30px 60px -18px rgba(0,40,120,.35);background:#fff;}
  .photo-card img{width:100%;height:100%;object-fit:cover;object-position:70% center;display:block;}
</style>
