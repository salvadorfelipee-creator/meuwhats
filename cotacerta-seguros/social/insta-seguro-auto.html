<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Cota Certa — Post Instagram Seguro Auto</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@700;800&family=Inter:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{width:1080px;height:1080px;overflow:hidden;font-family:'Segoe UI',Inter,Arial,sans-serif;}
  .post{
    position:relative;
    width:1080px;height:1080px;
    background:#EAF1FF;
    overflow:hidden;
  }
  .photo{
    position:absolute;
    left:0;top:0;
    width:640px;height:1080px;
    overflow:hidden;
  }
  .photo img{
    position:absolute;
    left:-160px;top:-40px;
    width:960px;
    height:1160px;
    object-fit:cover;
    -webkit-mask-image: linear-gradient(90deg,#000 0%,#000 68%, rgba(0,0,0,0) 99%);
    mask-image: linear-gradient(90deg,#000 0%,#000 68%, rgba(0,0,0,0) 99%);
  }
  .blob{
    position:absolute;
    left:0;top:0;
    width:1080px;height:1080px;
    background:linear-gradient(150deg,#1a7bff 0%,#0052CC 100%);
    clip-path:path("M1080,0 L700,0 C580,260 580,820 700,1080 L1080,1080 Z");
  }
  .content{
    position:absolute;
    right:56px;top:150px;
    width:370px;
    color:#fff;
  }
  .headline{
    font-family:'Poppins','Segoe UI',sans-serif;
    font-size:50px;
    font-weight:800;
    line-height:1.14;
    letter-spacing:-0.5px;
  }
  .headline b{font-weight:800;}
  .sub{
    margin-top:22px;
    font-size:22px;
    font-weight:500;
    color:rgba(255,255,255,.92);
    line-height:1.4;
    max-width:380px;
  }
  .pill{
    display:inline-flex;
    align-items:center;
    gap:8px;
    margin-top:34px;
    background:rgba(255,255,255,.16);
    border:1px solid rgba(255,255,255,.35);
    color:#fff;
    font-weight:700;
    font-size:17px;
    padding:11px 20px;
    border-radius:50px;
  }
  .cta-box{
    position:absolute;
    left:64px;
    bottom:150px;
    background:#fff;
    border-radius:20px;
    padding:22px 26px;
    box-shadow:0 24px 50px -18px rgba(0,20,60,.35);
    display:flex;
    align-items:center;
    gap:16px;
    width:520px;
  }
  .cta-box .wa-ic{
    width:52px;height:52px;border-radius:50%;
    background:#25D366;color:#fff;
    display:flex;align-items:center;justify-content:center;
    font-size:26px;flex-shrink:0;
  }
  .cta-box .txt small{
    display:block;
    color:#666D80;
    font-size:14px;
    font-weight:600;
  }
  .cta-box .txt strong{
    display:block;
    color:#1A1D29;
    font-family:'Poppins','Segoe UI',sans-serif;
    font-size:24px;
    font-weight:800;
    margin-top:2px;
  }
  .footer{
    position:absolute;
    left:0; right:0; bottom:0;
    height:96px;
    background:#0F1117;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 64px;
  }
  .footer .logo-chip{
    background:#fff;
    border-radius:12px;
    padding:8px 14px;
    display:flex;
    align-items:center;
  }
  .footer .logo-chip img{height:34px;display:block;}
  .footer .site-url{
    color:rgba(255,255,255,.75);
    font-weight:700;
    font-size:18px;
    letter-spacing:.2px;
  }
</style>
</head>
<body>
  <div class="post">
    <div class="blob"></div>
    <div class="photo">
      <img src="../img/hero-auto.jpg">
    </div>
    <div class="content">
      <div class="headline">Compare<br>seguro <b>auto</b><br>e economize!</div>
      <div class="sub">Receba as melhores propostas direto no seu WhatsApp. Grátis e sem compromisso.</div>
      <div class="pill">⚡ Resposta em minutos</div>

    <div class="cta-box">

      </div>
      <div class="txt">

    </div>
    <div class="footer">

      <div class="site-url">cotacertaseguros.com.br</div>
    </div>
  </div>
</body>
</html>
