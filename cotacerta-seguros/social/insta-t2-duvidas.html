<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Cota Certa — Fale conosco e tire suas dúvidas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@700;800&family=Inter:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{width:1080px;height:1350px;overflow:hidden;font-family:'Segoe UI',Inter,Arial,sans-serif;}
  .post{position:relative;width:1080px;height:1350px;background:#1A1D29;overflow:hidden;}

  .photo{position:absolute;inset:0;width:1080px;height:1350px;overflow:hidden;}
  .photo img{width:100%;height:100%;object-fit:cover;object-position:65% 25%;display:block;}

  .scrim{position:absolute;left:0;top:0;width:1080px;height:520px;
    background:linear-gradient(180deg,rgba(255,255,255,.55) 0%,rgba(255,255,255,.15) 60%,rgba(255,255,255,0) 100%);}

  .ring{position:absolute;right:-160px;top:-40px;width:560px;height:560px;border-radius:50%;
    border:56px solid rgba(0,102,255,.45);z-index:2;}

  .topbar{position:absolute;left:56px;top:48px;display:flex;align-items:center;gap:10px;color:#1A1D29;z-index:5;}
  .topbar svg{width:22px;height:22px;}
  .topbar .handle{font-weight:700;font-size:16px;}

  .headline{position:absolute;left:56px;top:110px;width:520px;color:#12141c;font-family:'Poppins','Segoe UI',sans-serif;font-size:44px;font-weight:800;line-height:1.2;z-index:5;text-shadow:0 2px 18px rgba(255,255,255,.5);}
  .headline b{color:#0052CC;}

  .card{position:absolute;left:56px;bottom:330px;width:400px;background:#fff;border-radius:20px;padding:26px 28px;
    box-shadow:0 30px 60px -20px rgba(0,0,0,.4);z-index:5;}
  .card p{font-size:19px;color:#1A1D29;line-height:1.5;margin-bottom:20px;}
  .card p b{color:#0052CC;}
  .card .btn{display:inline-flex;align-items:center;gap:8px;background:#0052CC;color:#fff;font-weight:800;
    font-size:15px;padding:11px 20px;border-radius:50px;}
  .card .btn svg{width:15px;height:15px;}

  .star{position:absolute;color:#fff;z-index:3;filter:drop-shadow(0 2px 6px rgba(0,0,0,.25));}
  .s1{left:770px;top:330px;width:40px;}
  .s2{left:520px;top:430px;width:24px;opacity:.85;}

  .bar{position:absolute;left:56px;width:500px;bottom:250px;background:linear-gradient(150deg,#1a7bff,#0052CC);
    border-radius:50px;padding:12px 16px;display:flex;align-items:center;gap:12px;box-shadow:0 20px 40px -16px rgba(0,0,0,.5);z-index:5;}
  .bar .logo-chip{background:#fff;border-radius:40px;padding:7px 14px;display:flex;align-items:center;flex-shrink:0;}
  .bar .logo-chip img{height:22px;display:block;}
  .bar .info{display:flex;align-items:center;gap:7px;color:#fff;font-size:12.5px;font-weight:600;white-space:nowrap;}
  .bar .info svg{width:14px;height:14px;flex-shrink:0;}
  .bar .sep{width:1px;height:22px;background:rgba(255,255,255,.3);flex-shrink:0;}
  .bar .chat{margin-left:auto;width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,.2);
    display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .bar .chat svg{width:16px;height:16px;color:#fff;}
</style>
</head>
<body>
  <div class="post">
    <div class="photo"><img src="../img/homem-telefone.jpg"></div>
    <div class="scrim"></div>
    <div class="ring"></div>

    <svg class="star s1" viewBox="0 0 24 24" fill="currentColor"><path d="M12 0l2 10 10 2-10 2-2 10-2-10L0 12l10-2z"/></svg>
    <svg class="star s2" viewBox="0 0 24 24" fill="currentColor"><path d="M12 0l2 10 10 2-10 2-2 10-2-10L0 12l10-2z"/></svg>

    <div class="topbar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="2" y="2" width="20" height="20" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1"/></svg>
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M13 22v-9h3l1-4h-4V6.5C13 5.36 13.36 4 15 4h2V.5C16.5.35 15.3 0 13.9 0 10.4 0 8 2.15 8 6v3H5v4h3v9h5z"/></svg>
      <div class="handle">@cotacertaseguros</div>
    </div>

    <div class="headline">Fale co-<br>nosco <b>e tire todas<br>as suas dúvidas</b></div>

    <div class="card">
      <p>Vamos te ajudar a encontrar <b>o melhor plano e fechar o melhor negócio.</b></p>
      <div class="btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 8v4l3 3"/></svg>
        Leia a Legenda
      </div>
    </div>

    <div class="bar">
      <div class="logo-chip"><img src="../img/logo.png"></div>
      <div class="sep"></div>
      <div class="info">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15.3 15.3 0 0 1 0 20 15.3 15.3 0 0 1 0-20z"/></svg>
        cotacertaseguros.com.br
      </div>
      <div class="sep"></div>
      <div class="info">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
        (47) 99610-3804
      </div>
      <div class="chat">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
      </div>
    </div>
  </div>
</body>
</html>
