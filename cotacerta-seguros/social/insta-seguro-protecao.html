<!doctype html>

<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{width:1080px;height:1080px;overflow:hidden;font-family:'Segoe UI',Inter,Arial,sans-serif;}
  .post{position:relative;width:1080px;height:1080px;background:#EAF1FF;overflow:hidden;}
  .post::before{content:'';position:absolute;left:-140px;top:40px;width:780px;height:780px;border-radius:50%;border:1px solid rgba(0,82,204,.12);}
  .photo{position:absolute;left:0;top:0;width:600px;height:1080px;overflow:hidden;}
  .photo img{position:absolute;left:-260px;top:-20px;width:1150px;height:1250px;object-fit:cover;
    -webkit-mask-image: linear-gradient(90deg,#000 0%,#000 62%, rgba(0,0,0,0) 96%);
    mask-image: linear-gradient(90deg,#000 0%,#000 62%, rgba(0,0,0,0) 96%);}
  .blob{position:absolute;left:470px;top:-210px;width:1010px;height:1010px;border-radius:50%;
    background:linear-gradient(150deg,#1a7bff 0%,#0052CC 100%);
    box-shadow:0 40px 80px -30px rgba(0,60,160,.4);}
  .content{position:absolute;left:665px;top:130px;width:360px;color:#fff;}
  .headline{font-family:'Poppins','Segoe UI',sans-serif;font-size:44px;font-weight:800;line-height:1.18;letter-spacing:-.3px;}
  .stat-wrap{position:absolute;left:665px;top:430px;color:#fff;}
  .stat-wrap .lbl{font-size:19px;font-weight:600;opacity:.92;}
  .stat-wrap .num{font-family:'Poppins','Segoe UI',sans-serif;font-size:64px;font-weight:800;line-height:1.05;margin-top:2px;}
  .bottom-block{position:absolute;left:665px;top:800px;width:380px;}
  .icon-row{display:flex;gap:16px;color:#1A1D29;margin-bottom:22px;}
  .icon-row svg{width:24px;height:24px;}
  .cta-line{font-size:16px;color:#1A1D29;font-weight:500;line-height:1.35;margin-bottom:12px;}
  .cta-line b{font-weight:800;}
  .wa-line{display:flex;align-items:center;gap:10px;margin-bottom:18px;}
  .wa-line .ic{width:30px;height:30px;border-radius:50%;background:#25D366;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .wa-line .ic svg{width:16px;height:16px;fill:#fff;}
  .wa-line span{font-weight:800;color:#1A1D29;font-size:19px;}
  .soc-line{display:flex;align-items:center;gap:10px;}
  .soc-badge{width:26px;height:26px;border-radius:8px;background:#0052CC;color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;}
  .soc-line .site{font-family:'Poppins','Segoe UI',sans-serif;font-weight:800;color:#0052CC;font-size:18px;}
</style>
