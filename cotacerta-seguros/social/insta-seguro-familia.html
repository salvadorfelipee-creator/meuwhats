<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Cota Certa — Post Instagram Seguro para a Família</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@700;800&family=Inter:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{width:1080px;height:1080px;overflow:hidden;font-family:'Segoe UI',Inter,Arial,sans-serif;}
  .post{position:relative;width:1080px;height:1080px;background:#0F1117;overflow:hidden;}
  .post::before{content:'';position:absolute;left:50%;top:410px;transform:translate(-50%,-50%);width:900px;height:900px;border-radius:50%;border:1px solid rgba(255,255,255,.08);}
  .half-top{position:absolute;left:0;top:0;width:1080px;height:1080px;background:#EAF1FF;
    clip-path:path("M60,460 A480,480 0 0 1 1020,460 L1020,460 L60,460 Z");}
  .half-bottom{position:absolute;left:0;top:0;width:1080px;height:1080px;background:linear-gradient(150deg,#1a7bff 0%,#0052CC 100%);
    clip-path:path("M60,460 A480,480 0 0 0 1020,460 L1020,460 L60,460 Z");}
  .headline{position:absolute;left:600px;top:120px;width:380px;color:#0F1117;font-family:'Poppins','Segoe UI',sans-serif;font-size:42px;font-weight:800;line-height:1.16;letter-spacing:-.3px;}
  .headline b{color:#0052CC;}
  .photo-card{position:absolute;left:150px;top:330px;width:660px;height:420px;border-radius:22px;overflow:hidden;
    box-shadow:0 30px 60px -20px rgba(0,0,0,.5);border:8px solid #fff;}
  .photo-card img{width:100%;height:100%;object-fit:cover;display:block;}
  .stat-wrap{position:absolute;left:600px;top:775px;width:260px;color:#fff;}
  .stat-wrap .lbl{font-size:15px;font-weight:600;opacity:.92;}
  .stat-wrap .num{font-family:'Poppins','Segoe UI',sans-serif;font-size:42px;font-weight:800;line-height:1.05;margin-top:2px;}
  .bar{position:absolute;left:64px;right:64px;bottom:56px;background:#1A1D29;border-radius:20px;
    padding:22px 30px;display:flex;align-items:center;justify-content:space-between;
    box-shadow:0 20px 40px -16px rgba(0,0,0,.5);}
  .bar-left{display:flex;align-items:center;gap:22px;color:#fff;}
  .icon-row{display:flex;gap:14px;color:#fff;}
  .icon-row svg{width:20px;height:20px;}
  .cta-txt{font-size:15px;font-weight:500;line-height:1.3;}
  .cta-txt b{font-weight:800;}
  .wa-line{display:flex;align-items:center;gap:9px;}
  .wa-line .ic{width:26px;height:26px;border-radius:50%;background:#25D366;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .wa-line .ic svg{width:14px;height:14px;fill:#fff;}
  .wa-line span{font-weight:800;color:#fff;font-size:16px;}
  .bar-right{display:flex;align-items:center;gap:10px;}
  .soc-badge{width:24px;height:24px;border-radius:7px;background:#0066FF;color:#fff;display:flex;align-items:center;justify-content:center;font-size:11.5px;font-weight:800;}
  .site{font-family:'Poppins','Segoe UI',sans-serif;font-weight:800;color:#fff;font-size:15px;}
</style>
</head>
<body>
  <div class="post">
    <div class="half-top"></div>
    <div class="half-bottom"></div>
    <div class="headline">Cuide do seu carro,<br>cuide de <b>quem<br>você ama!</b></div>
    <div class="photo-card"><img src="../img/hero-family.jpg"></div>
    <div class="stat-wrap">
      <div class="lbl">Resposta via WhatsApp em</div>
      <div class="num">10 min</div>
    </div>
    <div class="bar">
      <div class="bar-left">
        <div class="icon-row">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
        </div>
        <div class="cta-txt">Solicite com a gente<br><b>o seu orçamento</b></div>

          <span>(47) 99610-3804</span>
        </div>
      </div>
      <div class="bar-right">
        <div class="soc-badge">IG</div>
        <div class="soc-badge">f</div>
        <div class="site">cotacertaseguros.com.br</div>
      </div>
    </div>
  </div>
</body>
</html>
