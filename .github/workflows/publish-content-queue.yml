name: Publica fila de conteúdo (blog)

# Publica automaticamente os posts agendados em content-queue/ cujo publishDate chegou.
# Script puro em Node (scripts/publish-content-queue.js) — não usa IA/Claude, zero custo de tokens.
# O conteúdo em si já foi escrito antes (em lote) e só está esperando a data certa.

on:
  schedule:
    - cron: "0 12 * * *" # todo dia, meio-dia UTC
  workflow_dispatch: {} # permite rodar manualmente em Actions > Run workflow

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Configura git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Publica posts agendados pra hoje
        run: node scripts/publish-content-queue.js
